<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Pagina limpa</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px system-ui, sans-serif; line-height: 1.5; }
    img { max-width: 240px; display: block; margin: 16px 0; }
    label { display: block; margin: 12px 0 4px; }
    input, button { padding: 8px; font: inherit; }
  </style>
</head>
<body>
  <header>
    <h1>Pagina limpa de referencia</h1>
    <nav aria-label="Navegacao principal"><a href="#conteudo">Ir para o conteudo</a></nav>
  </header>
  <main id="conteudo">
    <h2>Conteudo</h2>
    <p>Esta pagina possui uma estrutura basica e elementos nomeados.</p>
    <img src="missing-image.png" alt="Ponto decorativo">
    <form>
      <label for="busca">Buscar</label>
      <input id="busca" type="search">
      <button type="submit">Pesquisar</button>
    </form>
  </main>
</body>
</html>
