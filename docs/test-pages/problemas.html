<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Problemas conhecidos</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px system-ui, sans-serif; }
    .baixo-contraste { color: #aaa; background: #fff; }
    .bloco { margin: 24px 0; }
  </style>
</head>
<body>
  <h1>Pagina com problemas conhecidos</h1>
  <div class="bloco">
    <h2>Imagem sem texto alternativo</h2>
    <img src="missing-image.png" alt="">
  </div>
  <div class="bloco">
    <h2>Campos e botoes sem nome adequado</h2>
    <input type="text" value="Campo sem label">
    <button type="button"></button>
  </div>
  <div class="bloco">
    <h2>Link sem texto</h2>
    <a href="#"></a>
  </div>
  <div class="bloco baixo-contraste">
    <h2>Contraste reduzido</h2>
    <p>Este texto foi criado para um teste visual de contraste.</p>
  </div>
  <div class="bloco">
    <h4>Heading fora da sequencia</h4>
  </div>
</body>
</html>
