<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de ARIA</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px system-ui, sans-serif; }
    .tabs { display: flex; gap: 8px; margin: 20px 0; }
    button { padding: 9px 14px; }
    [role="dialog"] { border: 1px solid #777; padding: 16px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Atributos ARIA e estados</h1>
  <p id="ajuda">Escolha uma aba para consultar os detalhes.</p>
  <div class="tabs" role="tablist" aria-label="Categorias">
    <button id="tab-um" role="tab" aria-selected="true" aria-controls="painel-um">Resumo</button>
    <button id="tab-dois" role="tab" aria-selected="false" aria-controls="painel-dois">Detalhes</button>
  </div>
  <section id="painel-um" role="tabpanel" aria-labelledby="tab-um" aria-describedby="ajuda">
    <h2>Resumo</h2>
    <p>Conteudo do resumo.</p>
  </section>
  <section id="painel-dois" role="tabpanel" aria-labelledby="tab-dois" hidden>
    <h2>Detalhes</h2>
    <p>Conteudo dos detalhes.</p>
  </section>
  <div role="dialog" aria-labelledby="titulo-dialogo" aria-describedby="texto-dialogo">
    <h2 id="titulo-dialogo">Dialogo de teste</h2>
    <p id="texto-dialogo">Descricao do dialogo.</p>
    <button aria-label="Fechar dialogo">X</button>
  </div>
</body>
</html>
