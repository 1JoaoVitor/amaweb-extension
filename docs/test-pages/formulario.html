<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Teste de formulario</title>
  <style>
    body { max-width: 760px; margin: 40px auto; padding: 0 20px; font: 16px system-ui, sans-serif; }
    form { display: grid; gap: 16px; max-width: 520px; }
    label { display: grid; gap: 6px; font-weight: 600; }
    input, textarea, select, button { padding: 9px; font: inherit; }
    fieldset { display: grid; gap: 10px; }
  </style>
</head>
<body>
  <h1>Formulario com dados de teste</h1>
  <p>Os valores abaixo devem desaparecer apenas no HTML enviado quando a sanitizacao estiver ativada.</p>
  <form>
    <label for="nome">Nome completo
      <input id="nome" name="nome" type="text" value="Maria de Teste">
    </label>
    <label for="email">E-mail
      <input id="email" name="email" type="email" value="maria.teste@example.com">
    </label>
    <label for="senha">Senha
      <input id="senha" name="senha" type="password" value="senha-nao-real">
    </label>
    <label for="mensagem">Mensagem
      <textarea id="mensagem" name="mensagem">Conteudo privado de teste</textarea>
    </label>
    <label for="categoria">Categoria
      <select id="categoria" name="categoria">
        <option value="geral">Geral</option>
        <option value="suporte" selected>Suporte</option>
      </select>
    </label>
    <label><input type="checkbox" checked> Aceito os termos de teste</label>
    <button type="submit">Enviar formulario</button>
  </form>
</body>
</html>
